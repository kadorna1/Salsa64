name: Salsa64 PS3 build (v2.10b)

on:
  push:
    branches:
      - fix/cruisn-usa-exotica
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ps3-pkg:
    name: Build PS3 PKG and host unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply temporary build version tag
        shell: bash
        run: |
          git tag -f v2.10b "$GITHUB_SHA"
          echo "Building $(git describe --tags --always --dirty) from $GITHUB_SHA"

      - name: Build PS3 toolchain container
        run: tools/docker-image.sh

      - name: Run host unit tests
        run: tools/build.sh test-host

      - name: Build installable PS3 package
        run: tools/build.sh -C src/frontend pkg

      - name: Upload package and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salsa64-v2.10b-ps3-pkg
          path: |
            build/salsa64/salsa64.pkg
            build/logs/docker-image.log
          if-no-files-found: warn
          compression-level: 0
