name: Dr. Mario 64 framebuffer fix (v2.14)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/rdp/**"
      - "src/frontend/main.c"
      - "lib/rsxkit/**"
      - "tests/unit/test_targets.c"
      - "mk/ps3.mk"
      - "tools/prepare_snd0.py"
      - "assets/ps3/SND0.AT3"
      - ".github/workflows/dr-mario64-v214.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dr-mario64-v214-cached-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests-and-ps3-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse or build the current PS3 toolchain image
        shell: bash
        run: |
          set -euo pipefail
          DOCKERFILE_HASH="$(sha256sum docker/Dockerfile | cut -c1-16)"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/salsa64-toolchain:$DOCKERFILE_HASH"
          COMPAT_IMAGE="ghcr.io/kadorna1/salsa64-toolchain:f24becb301d65113"
          if docker pull "$IMAGE"; then
            if docker run --rm "$IMAGE" sh -c 'test -s "$PS3DEV/portlibs/ppu/include/zlib.h" && test -s "$PS3DEV/portlibs/ppu/lib/libz.a"'; then
              echo "SALSA64_IMAGE=$IMAGE" >> "$GITHUB_ENV"
              echo "Using cached toolchain image: $IMAGE"
              exit 0
            fi
            echo "Cached image lacks PPU zlib; checking compatibility cache."
          else
            echo "No exact Dockerfile image for hash $DOCKERFILE_HASH; checking compatibility cache."
          fi
          # This previously successful image differs only by the runner-side
          # zlib1g-dev package, which is installed separately below. Confirm
          # the PPU zlib headers and library before reusing it.
          if docker pull "$COMPAT_IMAGE"; then
            if docker run --rm "$COMPAT_IMAGE" sh -c 'test -s "$PS3DEV/portlibs/ppu/include/zlib.h" && test -s "$PS3DEV/portlibs/ppu/lib/libz.a"'; then
              echo "SALSA64_IMAGE=$COMPAT_IMAGE" >> "$GITHUB_ENV"
              echo "Using compatible cached toolchain image: $COMPAT_IMAGE"
              exit 0
            fi
          fi
          echo "No usable cached image; building current toolchain image."
          echo "SALSA64_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          SALSA64_IMAGE="$IMAGE" tools/docker-image.sh
          docker run --rm "$IMAGE" sh -c 'test -s "$PS3DEV/portlibs/ppu/include/zlib.h" && test -s "$PS3DEV/portlibs/ppu/lib/libz.a"'
          docker push "$IMAGE"

      - name: Install host zlib headers
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Run host regression suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make test-host 2>&1 | tee build/logs/dr-mario-host-tests.log

      - name: Build installable PS3 PKG
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build.sh -C src/frontend pkg 2>&1 | tee build/logs/dr-mario-ps3-package.log
          test -s build/salsa64/salsa64.pkg
          test -s assets/ps3/SND0.AT3
          test -s build/salsa64/obj/pkg/SND0.AT3
          python3 tools/prepare_snd0.py --check assets/ps3/SND0.AT3 build/salsa64/obj/pkg/SND0.AT3
          echo "Normalized XMB hover audio verified at the PKG content root."
          sha256sum assets/ps3/SND0.AT3 build/salsa64/obj/pkg/SND0.AT3

      - name: Upload package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-mario64-v2.14
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
          path: |
            build/salsa64/salsa64.pkg
            build/logs/docker-image.log
            build/logs/dr-mario-host-tests.log
            build/logs/dr-mario-ps3-package.log
