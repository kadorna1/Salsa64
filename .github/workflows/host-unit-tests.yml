name: Host unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host unit tests
        run: make -C tests/unit run
