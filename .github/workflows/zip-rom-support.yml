name: ZIP ROM support

on:
  pull_request:
    branches: [main]
    paths:
      - "src/frontend/ziprom.c"
      - "src/frontend/ziprom.h"
      - "src/frontend/romlist.c"
      - "src/frontend/Makefile"
      - "tests/unit/test_ziprom.c"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: zip-rom-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests-and-ps3-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from the main milestone and successful revisions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(bash tools/ci-version.sh)"
          echo "SALSA64_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $VERSION from $GITHUB_SHA"

      - name: Install host zlib headers
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Run native host regression suite
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make test-host 2>&1 | tee build/logs/ziprom-host-tests.log

      - name: Select reusable PS3 toolchain image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/kadorna1/salsa64-toolchain:10ba33a3a3733eaa"
          echo "SALSA64_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Reusing published PS3 toolchain image: $IMAGE"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull existing PS3 toolchain image
        run: docker pull "$SALSA64_IMAGE"

      - name: Download pinned zlib source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/third_party
          curl --fail --location --silent --show-error \
            https://zlib.net/fossils/zlib-1.3.2.tar.gz \
            -o /tmp/zlib-1.3.2.tar.gz
          echo "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16  /tmp/zlib-1.3.2.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/zlib-1.3.2.tar.gz -C build/third_party

      - name: Build zlib for the PS3 PPU
        shell: bash
        run: |
          set -euo pipefail
          tools/build.sh --sh '
            set -eu
            cd /src/build/third_party/zlib-1.3.2
            CC=ppu-gcc AR=ppu-ar RANLIB=ppu-ranlib \
              CFLAGS="-O2 -mcpu=cell -mno-relative-jumptables" \
              ./configure --static --prefix=/src/build/ps3-portlibs
            make -j2
            make install
          '

      - name: Verify PPU zlib headers and archive
        shell: bash
        run: |
          set -euo pipefail
          test -s build/ps3-portlibs/include/zlib.h
          test -s build/ps3-portlibs/lib/libz.a
          tools/build.sh --sh '
            set -eu
            test -s /src/build/ps3-portlibs/include/zlib.h
            test -s /src/build/ps3-portlibs/lib/libz.a
          '

      - name: Build PS3 PKG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          tools/build.sh -C src/frontend pkg ZLIB_PREFIX=/src/build/ps3-portlibs 2>&1 | tee build/logs/ziprom-ps3-package.log
          test -s build/salsa64/salsa64.pkg

      - name: Upload package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zip-rom-support
          if-no-files-found: warn
          path: |
            build/salsa64/salsa64.pkg
            build/logs/ziprom-host-tests.log
            build/logs/ziprom-ps3-package.log
