name: ZIP ROM support

on:
  pull_request:
    branches: [main]
    paths:
      - "src/frontend/ziprom.c"
      - "src/frontend/ziprom.h"
      - "src/frontend/main.c"
      - "src/frontend/romlist.c"
      - "src/frontend/Makefile"
      - "tests/unit/**"
      - "docker/**"
      - "tools/**"
      - ".github/workflows/zip-rom-support.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: zip-rom-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests-and-ps3-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host zlib headers
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Run native host regression suite
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make test-host 2>&1 | tee build/logs/ziprom-host-tests.log

      - name: Select reusable PS3 toolchain image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/kadorna1/salsa64-toolchain:10ba33a3a3733eaa"
          echo "SALSA64_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Reusing published PS3 toolchain image: $IMAGE"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull existing PS3 toolchain image
        run: docker pull "$SALSA64_IMAGE"

      - name: Verify PS3 zlib portlib
        shell: bash
        run: |
          set -euo pipefail
          tools/build.sh --sh 'test -f "$PS3DEV/portlibs/ppu/include/zlib.h" && test -f "$PS3DEV/portlibs/ppu/lib/libz.a"'

      - name: Build PS3 PKG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          tools/build.sh -C src/frontend pkg 2>&1 | tee build/logs/ziprom-ps3-package.log
          test -s build/salsa64/salsa64.pkg

      - name: Upload package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zip-rom-support
          if-no-files-found: warn
          path: |
            build/salsa64/salsa64.pkg
            build/logs/ziprom-host-tests.log
            build/logs/ziprom-ps3-package.log
