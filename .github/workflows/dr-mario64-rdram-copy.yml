name: Dr. Mario 64 RDRAM color-copy fix

on:
  pull_request:
    branches: [main]
    paths:
      - "src/rdp/**"
      - "src/frontend/**"
      - "src/rsp/gfx/**"
      - "tests/**"
      - "tools/**"
      - "docker/**"
      - ".github/workflows/dr-mario64-rdram-copy.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: dr-mario64-rdram-copy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests-and-ps3-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version from the main milestone and successful revisions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(bash tools/ci-version.sh)"
          echo "SALSA64_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $VERSION from $GITHUB_SHA"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile on main builds pinned static PPU zlib. Reuse the image
      # keyed to that exact Dockerfile; only build/publish it if missing.
      - name: Reuse or build current PS3 toolchain image
        shell: bash
        run: |
          set -euo pipefail
          DOCKERFILE_HASH="$(sha256sum docker/Dockerfile | cut -c1-16)"
          IMAGE="ghcr.io/kadorna1/salsa64-toolchain:$DOCKERFILE_HASH"
          echo "SALSA64_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          if docker pull "$IMAGE"; then
            if docker run --rm "$IMAGE" sh -c 'test -s "$PS3DEV/portlibs/ppu/include/zlib.h" && test -s "$PS3DEV/portlibs/ppu/lib/libz.a"'; then
              echo "Using cached toolchain image with PPU zlib: $IMAGE"
              exit 0
            fi
            echo "Cached image does not contain PPU zlib; rebuilding from docker/Dockerfile."
          else
            echo "No cached image for Dockerfile $DOCKERFILE_HASH; building it once."
          fi
          SALSA64_IMAGE="$IMAGE" tools/docker-image.sh
          docker run --rm "$IMAGE" sh -c 'test -s "$PS3DEV/portlibs/ppu/include/zlib.h" && test -s "$PS3DEV/portlibs/ppu/lib/libz.a"'
          docker push "$IMAGE"

      - name: Install host zlib headers
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Run host regression suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make test-host 2>&1 | tee build/logs/dr-mario-host-tests.log

      - name: Build PS3 PKG
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build.sh -C src/frontend pkg 2>&1 | tee build/logs/dr-mario-ps3-package.log
          test -s build/salsa64/salsa64.pkg

      - name: Upload package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-mario64-rdram-color-copy
          if-no-files-found: warn
          path: |
            build/salsa64/salsa64.pkg
            build/logs/docker-image.log
            build/logs/dr-mario-host-tests.log
            build/logs/dr-mario-ps3-package.log
