name: Dr. Mario 64 RDRAM color-copy fix

on:
  pull_request:
    branches: [main]
    paths:
      - "src/rdp/**"
      - "src/frontend/**"
      - "src/rsp/gfx/**"
      - "tests/**"
      - "tools/**"
      - "docker/**"
      - ".github/workflows/dr-mario64-rdram-copy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dr-mario64-rdram-copy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests-and-ps3-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compute toolchain image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="$(cat docker/Dockerfile docker/cgcomp-wrapper.sh | sha256sum | cut -c1-16)"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/salsa64-toolchain:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull cached PS3 toolchain
        id: cached
        continue-on-error: true
        run: docker pull "${{ steps.image.outputs.image }}"

      - name: Build and publish toolchain image on cache miss
        if: steps.cached.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          tools/docker-image.sh
          docker tag salsa64-toolchain:dev "${{ steps.image.outputs.image }}"
          docker push "${{ steps.image.outputs.image }}"

      - name: Run host regression suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          tools/build.sh test-host 2>&1 | tee build/logs/dr-mario-host-tests.log

      - name: Build PS3 PKG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          tools/build.sh -C src/frontend pkg 2>&1 | tee build/logs/dr-mario-ps3-package.log
          test -s build/salsa64/salsa64.pkg

      - name: Upload package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-mario64-rdram-color-copy
          if-no-files-found: warn
          path: |
            build/salsa64/salsa64.pkg
            build/logs/dr-mario-host-tests.log
            build/logs/dr-mario-ps3-package.log
