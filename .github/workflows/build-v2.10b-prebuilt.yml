name: Salsa64 PS3 build (reusable Docker toolchain, v2.10b)

on:
  push:
    branches:
      - fix/cruisn-usa-exotica
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Do not cancel an active build when this workflow is first changed to publish
# the toolchain image. Later manual/push runs are still serialized per branch.
concurrency:
  group: salsa64-ps3-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ps3-pkg:
    name: Build PS3 PKG using the reusable Docker toolchain
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply temporary build version tag
        shell: bash
        run: |
          git tag -f v2.10b "$GITHUB_SHA"
          echo "Building $(git describe --tags --always --dirty) from $GITHUB_SHA"

      # The tag changes only when the Docker image recipe changes. Normal C/C++
      # source edits reuse the already-published image and skip GCC/binutils builds.
      - name: Select toolchain image version
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="$(sha256sum docker/Dockerfile docker/cgcomp-wrapper.sh | sha256sum | cut -c1-16)"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/salsa64-toolchain:${IMAGE_TAG}"
          echo "SALSA64_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Toolchain image: $IMAGE"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse published toolchain image (build and publish on cache miss)
        shell: bash
        run: |
          set -euo pipefail
          if docker pull "$SALSA64_IMAGE"; then
            echo "Reused cached toolchain image: $SALSA64_IMAGE"
          else
            echo "Toolchain image not present yet; building it once."
            tools/docker-image.sh
            docker push "$SALSA64_IMAGE"
          fi

      - name: Run host unit tests inside Docker
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          tools/build.sh test-host 2>&1 | tee build/logs/docker-unit-tests.log

      - name: Build installable PS3 package inside Docker
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          tools/build.sh -C src/frontend pkg 2>&1 | tee build/logs/docker-package-build.log
          test -s build/salsa64/salsa64.pkg

      - name: Upload package and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salsa64-v2.10b-ps3-pkg-docker-toolchain
          path: |
            build/salsa64/*.pkg
            build/logs/docker-image.log
            build/logs/docker-unit-tests.log
            build/logs/docker-package-build.log
          if-no-files-found: warn
          compression-level: 0
