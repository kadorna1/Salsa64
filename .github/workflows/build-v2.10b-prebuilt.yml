name: Salsa64 PS3 build (Docker toolchain, v2.10b)

on:
  push:
    branches:
      - fix/cruisn-usa-exotica
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salsa64-ps3-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ps3-pkg:
    name: Build PS3 PKG using the existing Docker toolchain
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply temporary build version tag
        shell: bash
        run: |
          git tag -f v2.10b "$GITHUB_SHA"
          echo "Building $(git describe --tags --always --dirty) from $GITHUB_SHA"

      - name: Build PS3 toolchain Docker image
        shell: bash
        run: tools/docker-image.sh

      - name: Run host unit tests inside Docker
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          tools/build.sh test-host 2>&1 | tee build/logs/docker-unit-tests.log

      - name: Build installable PS3 package inside Docker
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/logs
          tools/build.sh -C src/frontend pkg 2>&1 | tee build/logs/docker-package-build.log
          test -s build/salsa64/salsa64.pkg

      - name: Upload package and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salsa64-v2.10b-ps3-pkg-docker-toolchain
          path: |
            build/salsa64/*.pkg
            build/logs/docker-image.log
            build/logs/docker-unit-tests.log
            build/logs/docker-package-build.log
          if-no-files-found: warn
          compression-level: 0
